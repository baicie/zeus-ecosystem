# This file is mounted into the running container by
# `deploy/docker-compose.deploy.yml`, and `.github/workflows/playground-image.yml`
# uploads it to the host on every deploy. Keep it as the single source of truth:
# an image with a stale copy here would silently weaken the CSP.
#
# R4.3: same dist served on the public host origin (80) and the sandbox origin
# (81). The sandbox response-header CSP is mandatory; keep frame-ancestors
# pinned to the public Playground origin.
server {
  listen 80;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
  # The inline theme/language bootstrap runs before first paint; a hash keeps it
  # working without opening script-src to 'unsafe-inline'.
  # The preview's origin is a deployment decision, not a property of this file.
  #
  # It was a literal, so a self-hosted or local deployment could load the
  # editor and compile, and then had every preview iframe blocked by
  # `frame-src` pointing at the public Playground's panel origin. The browser
  # reported "Framing ... violates the following Content Security Policy
  # directive: frame-src https://panel.moonbyte.top:8443" and the preview never
  # appeared. That is silent in the worst way: the page renders, the compile
  # succeeds, and only the product's main output is missing.
  #
  # `ZEUS_SANDBOX_ORIGIN` is substituted by the nginx image's envsubst template
  # pass, the same mechanism `apps/ai-workbench` uses for its BYOK source list.
  # The shipped default is the production origin, so an unconfigured deploy
  # behaves exactly as before. Pinning it to an empty value would emit an empty
  # `frame-src`, which the browser treats as "falls back to default-src" — not a
  # permissive value, so a mistake here fails closed.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' sha256-Fy6Fg/7Sv8KQnE7ic7etVZR0qqjWoFQmG6YkpYff/tY=; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; frame-src ${ZEUS_SANDBOX_ORIGIN}; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}

server {
  listen 81;
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()" always;
  # Same reasoning as `frame-src` above: which host may frame the sandbox is a
  # deployment property. The no-opaque-origin guarantees come from
  # `sandbox allow-scripts`, not from this list, so widening the host does not
  # weaken the boundary — removing `sandbox` would.
  add_header Content-Security-Policy "sandbox allow-scripts; frame-ancestors ${ZEUS_PLAYGROUND_HOST_ORIGIN}" always;
  add_header Access-Control-Allow-Origin "*" always;
  add_header Cross-Origin-Resource-Policy cross-origin always;

  location / {
    try_files $uri $uri/ =404;
  }
}
