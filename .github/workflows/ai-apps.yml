# Application-level CI for the AI apps.
#
# `published-consumer.yml` answers a different question — can a third party
# install the published pair — and deliberately knows nothing about these apps.
# This workflow is about the apps themselves: their types, their unit tests,
# their production builds, and the browser gates that only make sense once the
# app is the thing under test.
#
# ## Job names are the contract
#
# Branch protection should require:
#
#   AI Apps / Node 22
#   AI Apps / Node 24
#   AI Workbench / Browser gates
#   AI Apps / Required      <- the aggregator
#
# None of them uses a path filter. A required check that never runs blocks the
# merge it was meant to guard, and that has already bitten this repository once.
#
# ## Two typechecks, not one
#
# `tsconfig.json` covers `src`. The gate scripts under `scripts/checks` are
# TypeScript too, and they were never typechecked by the app's own config —
# `tsconfig.checks.json` exists so a broken gate fails here rather than at
# runtime inside a browser run.
name: AI Apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  apps:
    name: AI Apps / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Record the environment
        run: |
          {
            echo "### ${{ matrix.node }}"
            echo
            echo '| key | value |'
            echo '| --- | --- |'
            echo "| node | $(node --version) |"
            echo "| pnpm | $(pnpm --version) |"
            echo "| sqlite without flag | $(node -e "try{require('node:sqlite');console.log('yes')}catch{console.log('no')}") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck the workbench
        working-directory: apps/ai-workbench
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Typecheck the workbench gate scripts
        working-directory: apps/ai-workbench
        run: pnpm exec tsc -p tsconfig.checks.json --noEmit

      - name: Typecheck the host
        working-directory: apps/ai-host
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Workbench unit tests
        working-directory: apps/ai-workbench
        run: pnpm exec vitest run

      # The host needs node:sqlite, which is behind a flag on 22.x and early
      # 24.x. `pnpm test` goes through the launcher, which probes the module
      # and sets NODE_OPTIONS only when it is unavailable.
      - name: Host unit tests
        working-directory: apps/ai-host
        run: pnpm test

      - name: Build the workbench
        working-directory: apps/ai-workbench
        run: pnpm exec vite build

      # `pnpm bundle`, not a copy of the command.
      #
      # This step used to spell out the bundler invocation, and the two drifted
      # the moment the bundler changed: tsup rewrites `node:` specifiers to bare
      # package names, so `node:sqlite` became an npm package that does not
      # exist, and the Dockerfile had already moved to esbuild. Calling the same
      # script the Dockerfile calls is what keeps them from disagreeing again.
      - name: Bundle the host
        working-directory: apps/ai-host
        run: pnpm bundle

      - name: Preserve build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-apps-node-${{ matrix.node }}
          path: |
            apps/ai-workbench/dist
            apps/ai-host/dist
          if-no-files-found: warn

  browsers:
    name: AI Workbench / Browser gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # Three engines. The gates themselves fail when one is missing rather
      # than skipping it, so this is the only place that decides the set.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Each gate writes its own JSON report into its temp directory. A gate
      # that runs but produces nothing must fail: an empty report and a passing
      # one look identical to a reader otherwise.
      - name: P0 (three engines)
        working-directory: apps/ai-workbench
        run: pnpm check:p0

      # BYOK defaults to chromium when the environment does not ask for more.
      # Naming all three here is what makes the three-engine claim true, and
      # the baseline check below fails if a run quietly drops back to one.
      - name: BYOK (three engines)
        working-directory: apps/ai-workbench
        env:
          ZEUS_AI_WORKBENCH_BROWSERS: chromium,firefox,webkit
        run: pnpm check:byok

      # CSP declares chromium only, and this is where that is recorded rather
      # than assumed: the baseline check requires exactly what the gate claims.
      - name: CSP
        working-directory: apps/ai-workbench
        run: pnpm check:csp

      # The assertion counts are the migration baseline. A gate that suddenly
      # asserts less is a regression even if it still says passed.
      - name: Assert the gates still assert what they did
        run: node scripts/checks/assert-gate-baseline.mjs

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-workbench-browser-gates
          path: |
            apps/ai-workbench/temp
            apps/ai-workbench/reports
          if-no-files-found: warn

  required:
    name: AI Apps / Required
    # The aggregator runs even when an upstream job failed, so it can report
    # *why* this is red instead of being skipped and looking absent.
    if: always()
    needs: [apps, browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        run: |
          apps='${{ needs.apps.result }}'
          browsers='${{ needs.browsers.result }}'

          echo "apps=$apps browsers=$browsers" | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$apps" != 'success' ]; then
            echo "::error::AI Apps matrix did not succeed ($apps)"
            exit 1
          fi
          if [ "$browsers" != 'success' ]; then
            echo "::error::AI Workbench browser gates did not succeed ($browsers)"
            exit 1
          fi
          echo "both required jobs succeeded"
