name: Published Core consumer smoke

# No path filter.
#
# The previous filter listed only the scripts and the matrix, so a pull request
# that changed an app's `package.json` — which is exactly when a published-Core
# consumer breaks — skipped this job entirely. A job that is a required check
# also must not filter: a required check that does not run blocks the merge it
# was meant to guard.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Now that this runs on every pull request, a superseded run must not keep
# holding a runner — and on `main` nothing is cancelled, so a push always gets a
# complete result.
concurrency:
  group: core-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-smoke:
    name: Published Core / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Verify published Core package metadata
        run: npm run check:registry
      - name: Verify isolated published Core consumer
        run: npm run check:core-consumer
