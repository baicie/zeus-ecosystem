# Application-level CI for the AI apps.
#
# `published-consumer.yml` answers a different question — can a third party
# install the published pair — and deliberately knows nothing about these apps.
# This workflow is about the apps themselves: their types, their unit tests,
# their production builds, and the browser gates that only make sense once the
# app is the thing under test.
#
# ## Job names are the contract
#
# Branch protection should require:
#
#   AI Apps / Node 22
#   AI Apps / Node 24
#   AI Workbench / Browser gates
#   Admin / Browser gates
#   AI Apps / Required      <- the aggregator
#
# None of them uses a path filter. A required check that never runs blocks the
# merge it was meant to guard, and that has already bitten this repository once.
#
# ## Two typechecks, not one
#
# `tsconfig.json` covers `src`. The gate scripts under `scripts/checks` are
# TypeScript too, and they were never typechecked by the app's own config —
# `tsconfig.checks.json` exists so a broken gate fails here rather than at
# runtime inside a browser run.
name: AI Apps

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-apps-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

jobs:
  apps:
    name: AI Apps / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Record the environment
        run: |
          {
            echo "### ${{ matrix.node }}"
            echo
            echo '| key | value |'
            echo '| --- | --- |'
            echo "| node | $(node --version) |"
            echo "| pnpm | $(pnpm --version) |"
            echo "| sqlite without flag | $(node -e "try{require('node:sqlite');console.log('yes')}catch{console.log('no')}") |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Typecheck the workbench
        working-directory: apps/ai-workbench
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Typecheck the workbench gate scripts
        working-directory: apps/ai-workbench
        run: pnpm exec tsc -p tsconfig.checks.json --noEmit

      - name: Typecheck the host
        working-directory: apps/ai-host
        run: pnpm exec tsc -p tsconfig.json --noEmit

      - name: Workbench unit tests
        working-directory: apps/ai-workbench
        run: pnpm exec vitest run

      # The host needs node:sqlite, which is behind a flag on 22.x and early
      # 24.x. `pnpm test` goes through the launcher, which probes the module
      # and sets NODE_OPTIONS only when it is unavailable.
      - name: Host unit tests
        working-directory: apps/ai-host
        run: pnpm test

      - name: Typecheck admin
        working-directory: apps/admin
        run: pnpm exec tsc -p tsconfig.json --noEmit

      # The gate scripts are TypeScript and the app's own config covers `src`
      # only, so without this a broken gate fails at runtime inside a browser.
      - name: Typecheck admin gate scripts
        working-directory: apps/admin
        run: pnpm exec tsc -p tsconfig.checks.json --noEmit

      # node:sqlite is behind a flag on 22.x, so this goes through the launcher
      # that probes it rather than calling vitest directly.
      - name: Admin server tests
        working-directory: apps/admin
        run: pnpm test:server

      # Protocol, origin, persistence across a real process restart, and the
      # readiness question `/health` cannot answer. The gate starts the host as
      # a child process so the restart is real.
      - name: Host protocol acceptance
        working-directory: apps/ai-host
        run: pnpm check:protocol

      - name: Build admin
        working-directory: apps/admin
        run: pnpm exec vite build

      - name: Build the workbench
        working-directory: apps/ai-workbench
        run: pnpm exec vite build

      # `pnpm bundle`, not a copy of the command.
      #
      # This step used to spell out the bundler invocation, and the two drifted
      # the moment the bundler changed: tsup rewrites `node:` specifiers to bare
      # package names, so `node:sqlite` became an npm package that does not
      # exist, and the Dockerfile had already moved to esbuild. Calling the same
      # script the Dockerfile calls is what keeps them from disagreeing again.
      - name: Bundle the host
        working-directory: apps/ai-host
        run: pnpm bundle

      - name: Preserve build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-apps-node-${{ matrix.node }}
          path: |
            apps/ai-workbench/dist
            apps/ai-host/dist
          if-no-files-found: warn

  browsers:
    name: AI Workbench / Browser gates
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install
        run: pnpm install --frozen-lockfile

      # Three engines. The gates themselves fail when one is missing rather
      # than skipping it, so this is the only place that decides the set.
      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # Each gate writes its own JSON report into its temp directory. A gate
      # that runs but produces nothing must fail: an empty report and a passing
      # one look identical to a reader otherwise.
      - name: P0 (three engines)
        working-directory: apps/ai-workbench
        run: pnpm check:p0

      # BYOK defaults to chromium when the environment does not ask for more.
      # Naming all three here is what makes the three-engine claim true, and
      # the baseline check below fails if a run quietly drops back to one.
      - name: BYOK (three engines)
        working-directory: apps/ai-workbench
        env:
          ZEUS_AI_WORKBENCH_BROWSERS: chromium,firefox,webkit
        run: pnpm check:byok

      # CSP declares chromium only, and this is where that is recorded rather
      # than assumed: the baseline check requires exactly what the gate claims.
      - name: CSP
        working-directory: apps/ai-workbench
        run: pnpm check:csp

      # The assertion counts are the migration baseline. A gate that suddenly
      # asserts less is a regression even if it still says passed.
      # The live gate never runs here. It needs a paid provider and credentials,
      # and a pull request must not call one. What runs is the part that must
      # hold either way: the redaction property and the refusal to make a call
      # without being asked. Without credentials it reports LIVE_BLOCKED, which
      # is neither a pass nor a failure — the unit tests are the gate.
      - name: Live gate guardrails (redaction and opt-in)
        working-directory: apps/ai-workbench
        run: pnpm exec vitest run __tests__/live-gate.spec.ts

      # Only the gates whose reports this job produces.
      #
      # The baseline checker reads report files, and a job can only read what
      # it wrote. The permission gate runs in `admin-browsers`, so its floor is
      # asserted there rather than here — a checker that looked for a file
      # another job writes would fail every time, and the obvious fix would be
      # to delete the entry.
      - name: Assert the AI gates still assert what they did
        run: node scripts/checks/assert-gate-baseline.mjs --only p0,byok,csp

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ai-workbench-browser-gates
          path: |
            apps/ai-workbench/temp
            apps/ai-workbench/reports
          if-no-files-found: warn

  admin-browsers:
    name: Admin / Browser gates
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      # The gate builds the app itself. It serves the production build from the
      # API server's origin, which is how it is deployed — a dev server would
      # exercise a different module graph and pass while the build was broken.
      - name: Admin browser acceptance (three engines)
        env:
          ZEUS_ADMIN_BROWSERS: chromium,firefox,webkit
        run: pnpm run check:admin-browser

      # The reference is a published image, pulled by digest.
      #
      # `:main` is a moving tag: it resolved to one build when the baseline was
      # taken and to a different one a pull later, and the two render
      # differently. A baseline describes one build, so the digest is the
      # reference — pulling the tag would compare against whatever was pushed
      # most recently and report the difference as a UI change.
      - name: Pull the visual reference image
        run: >-
          docker pull
          ghcr.io/baicie/zeus-admin@sha256:faf238d3b701ff896a5524225ef92ffdc99aed1828f1ed7088ee6c443096f819

      # Visual parity against the published reference image.
      #
      # It fails the job when a page loses a landmark, because that is a
      # regression nobody needs to adjudicate. It does not fail on a translated
      # page or on content the candidate added, and it never approves a
      # difference as intentional — that needs a person looking at the images.
      #
      # `--require-reference` because this job did pull it: a missing image here
      # means the pull silently did not happen, and that must fail rather than
      # report a comparison that never ran.
      #
      # No `continue-on-error`: a gate that is allowed to fail silently is a
      # gate nobody reads.
      - name: Admin visual parity against the reference image
        run: pnpm run check:admin-visual -- --require-reference

      # The permission model, proven against a rendered page and a real server.
      #
      # `permissions.test.ts` pins the capability table and the server's
      # `requireRole` call sites to each other; both are static. The three
      # claims that need a browser are that a viewer's workspace controls are
      # disabled, that a viewer's own language and theme still work, and that
      # the server refuses the write a disabled control would have sent. The
      # third is the boundary — a disabled button is a courtesy, the 403 is the
      # control — and a gate that only checked the button would pass a product
      # whose API was open.
      - name: Admin page permissions (browser)
        run: pnpm --filter @zeus-ecosystem/admin run check:permissions

      # The permission floor, next to the job that produces the report.
      - name: Assert the permission gate still asserts what it did
        run: node scripts/checks/assert-gate-baseline.mjs --only permissions

      # The gate scripts' own unit tests.
      #
      # These were run by hand during the migration and by nothing in CI. The
      # screenshot classifier decides what counts as a regression and the
      # capability table decides what a role may do; both are pure functions
      # with tests, and untested tests are a claim rather than a check.
      - name: Gate script unit tests
        working-directory: apps/admin
        run: pnpm run test:checks

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-browser-gates
          path: |
            apps/admin/temp/admin-browser
            apps/admin/temp/admin-visual
            apps/admin/temp/admin-permissions
          if-no-files-found: warn

  required:
    name: AI Apps / Required
    # The aggregator runs even when an upstream job failed, so it can report
    # *why* this is red instead of being skipped and looking absent.
    if: always()
    needs: [apps, browsers, admin-browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        run: |
          apps='${{ needs.apps.result }}'
          browsers='${{ needs.browsers.result }}'
          admin='${{ needs.admin-browsers.result }}'

          echo "apps=$apps browsers=$browsers admin=$admin" | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$apps" != 'success' ]; then
            echo "::error::AI Apps matrix did not succeed ($apps)"
            exit 1
          fi
          if [ "$browsers" != 'success' ]; then
            echo "::error::AI Workbench browser gates did not succeed ($browsers)"
            exit 1
          fi
          if [ "$admin" != 'success' ]; then
            echo "::error::Admin browser gates did not succeed ($admin)"
            exit 1
          fi
          echo "all required jobs succeeded"
