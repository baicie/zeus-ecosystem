name: Repository policy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ecosystem-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    name: Policy / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Validate boundaries and regression tests
        run: npm run check

      # The three readiness documents, generated from what is actually on disk.
      #
      # They are read-only and always exit 0 here: their verdicts are the
      # output, and this repository is `BLOCKED` on purpose — no image has been
      # pushed, no application is in production, and Phase 7 cannot start.
      # A job that failed on those verdicts would be red on every commit for a
      # reason nobody can fix in a commit, which is how a check becomes noise.
      #
      # What the job does enforce is that the documents can still be produced:
      # a reader that throws on a changed report shape fails here rather than
      # the first time somebody needs the answer during a cutover.
      - name: Produce the release candidate and the two preflights
        run: |
          node scripts/release/release-candidate.mjs --allow-not-ready --out temp/release-candidate.json
          node scripts/release/cutover-preflight.mjs --unit admin --allow-not-ready
          node scripts/release/cleanup-preflight.mjs --allow-not-ready

      - name: Preserve the readiness documents
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: readiness-node-${{ matrix.node }}
          path: temp/release-candidate.json
          if-no-files-found: warn

  apps:
    name: Apps build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false

      # Every app is built here rather than in a per-app workflow: they share one
      # lockfile and one install, and a per-app workflow would install the same
      # tree four times.
      #
      # This is what P8 asks for and what the Playground had none of when it
      # arrived — a migrated app with no build gate is an app whose next break
      # is discovered by whoever deploys it.
      - name: Install
        run: pnpm install --frozen-lockfile

      # CI can only call what each app declares, and they do not declare the same
      # thing: `ai-host` is a Node service with `bundle`, the other three are
      # Vite apps with `build`. Calling `run build` unconditionally fails on the
      # one that has no such script — `ERR_PNPM_RECURSIVE_RUN_NO_SCRIPT` — which
      # reads like a broken app rather than a naming difference.
      #
      # So each script is looked up in the manifest first, and a missing one is
      # reported by name instead of being skipped silently. `--if-present` would
      # have made this pass with three of four apps built.
      - name: Typecheck and build every app
        run: |
          set -euo pipefail
          built=0
          for app in apps/*/; do
            name=$(basename "$app")
            manifest="$app/package.json"
            [ -f "$manifest" ] || continue
            echo "::group::$name"

            if node -e "process.exit(require('./$manifest').scripts?.check ? 0 : 1)"; then
              pnpm --filter "./$app" run check
            else
              echo "::error::$name declares no 'check' script; add one so its types are gated"
              exit 1
            fi

            build_script=$(node -e "
              const s = require('./$manifest').scripts ?? {}
              const name = ['build', 'bundle'].find(candidate => s[candidate])
              if (!name) process.exit(1)
              process.stdout.write(name)
            ") || {
              echo "::error::$name declares neither 'build' nor 'bundle'; it has no build gate"
              exit 1
            }
            pnpm --filter "./$app" run "$build_script"
            built=$((built + 1))
            echo "::endgroup::"
          done
          echo "built $built app(s)"
          [ "$built" -ge 4 ] || {
            echo "::error::expected at least four apps, built $built"
            exit 1
          }

      # The Playground's sandbox is a second origin, not a second page. Its asset
      # URLs must stay relative or the Pages base path 404s them, and the build
      # silently produces a sandbox that cannot load its own module graph.
      - name: Playground sandbox assets are relative
        run: |
          set -euo pipefail
          test -f apps/playground/dist/sandbox.html
          if grep -qE '(src|href)="/assets/' apps/playground/dist/sandbox.html; then
            echo "::error::sandbox.html references absolute /assets/ URLs; they escape the Pages base path"
            exit 1
          fi
          echo "sandbox asset URLs are relative"

  # The Playground's product behaviour, in a job of its own.
  #
  # The `apps` job proves the four applications build. It says nothing about
  # whether the editor compiles, whether the preview runs, or whether the
  # exported project installs and works — and the Playground arrived from the
  # core repository with all of that checked only by a script nobody invoked.
  # A gate that exists and is never run reads, in every report, exactly like a
  # gate that passes.
  #
  # Chromium only. Firefox and WebKit are the same suite with a different
  # launcher, and three full runs (each doing an npm install of two exported
  # projects) is where this would stop being run at all. The three-engine claim
  # belongs to `Playground / Browser gates`, which is a release-candidate-level
  # job, not to a pull request.
  playground-browser:
    name: Playground / Browser gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          # The Playground's exported projects install `@zeus-js/*` from npm
          # with `engines: ^22.18.0 || >=24.11.0`. The platform binaries are
          # optional dependencies, and pnpm silently skips an optional package
          # whose engine the running Node does not satisfy — so an older Node
          # makes the native compiler disappear and the export fail with
          # `MODULE_NOT_FOUND`. Pin the version the packages declare.
          node-version: '24.16.0'
          package-manager-cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # The Playground declares its own `@playwright/test`, and the root
      # declares a different major-minor (`1.57.0` vs `1.65.1` here). `pnpm exec`
      # at the repo root resolves the root one, which on ubuntu-26.04 fails with
      # "Playwright does not support chromium on ubuntu26.04-x64" — a browser
      # that cannot be installed, on a job whose whole purpose is the browser.
      # Running the install through the app's own filter uses the version the
      # app's `node_modules` already has, and the cache key the two agree on.
      # Two versions of Playwright live in this repository: the root declares
      # 1.57.0, the Playground 1.65.1. A root `pnpm exec playwright` resolves
      # the root one, and on ubuntu-26.04 that build answers
      # "Playwright does not support chromium on ubuntu26.04-x64" — a browser
      # that cannot be installed, on the job whose entire purpose is the
      # browser. `--filter` selects the app's own version and the browser cache
      # key that goes with it.
      #
      # The version is printed rather than assumed: a future bump that makes
      # these disagree again should show up in the log, not as a confusing
      # install failure.
      - name: Install the one browser this job drives
        run: |
          pnpm --filter @zeus-ecosystem/playground exec playwright --version
          pnpm --filter @zeus-ecosystem/playground exec playwright install --with-deps --no-shell chromium

      - name: Build the Playground
        run: pnpm --filter @zeus-ecosystem/playground build

      # The editor gate covers compile, multi-file update, preview, diagnostics,
      # the devtools panel, the sandbox origin checks, and both exports end to
      # end: browser download, npm install, typecheck, production build, and a
      # real browser driving the built output.
      - name: Playground editor, exports and sandbox
        run: pnpm --filter @zeus-ecosystem/playground check:editor
        env:
          PLAYGROUND_BROWSERS: chromium

      - name: Sandbox CSP and origin boundary
        run: pnpm --filter @zeus-ecosystem/playground check:sandbox

      - name: Playground i18n keys
        run: pnpm --filter @zeus-ecosystem/playground check:i18n-keys

      - name: Preserve the Playground acceptance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playground-acceptance
          # The whole run directory, not just the report: the archives each
          # run produced are the evidence that the download, the npm install
          # and the build were checked against *that* commit's output. The
          # previous layout reused one directory, so an artifact could outlive
          # the run that produced it.
          path: |
            apps/playground/temp/playground-editor/runs/
            apps/playground/temp/playground-image/report.json
          if-no-files-found: warn
