name: Published Core UI pair preflight

on:
  workflow_dispatch:
    inputs:
      core_version:
        description: Exact published Core version
        required: true
        type: string
        default: 0.2.0-rc.5
      ui_version:
        description: Exact published UI version; a missing release must fail
        required: true
        type: string
        default: 0.1.0-beta.35

permissions:
  contents: read

jobs:
  pair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        manager: [npm, pnpm]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.33.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install exact published Core and UI packages in isolation
        run: node scripts/verify-published-pair.mjs --core "${{ inputs.core_version }}" --ui "${{ inputs.ui_version }}" --manager "${{ matrix.manager }}" --out pair-evidence.json
      - name: Preserve evidence (success or failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pair-${{ matrix.node }}-${{ matrix.manager }}
          path: pair-evidence.json
          if-no-files-found: warn
